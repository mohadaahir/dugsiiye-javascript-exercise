<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Blog Post Application</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Simple Blog</h1>

  <div class="container">

    <h2>Create a New Post</h2>

    <form id="post-form">
      <input type="text" id="title-input" placeholder="Post Title" required>
      <input type="text" id="image-input" placeholder="Image URL (optional)">
      <textarea id="content-input" placeholder="Write your post here..." rows="6" required></textarea>
      <button type="submit">Add Post</button>
    </form>

  </div>

  <div class="container">
    <h2>All Posts</h2>
    <div id="posts-list">
      <!-- Posts will be rendered here by JavaScript -->
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
